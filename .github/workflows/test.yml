name: Formula tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9
      - name: Install from checked out tap
        run: |
          brew tap --custom-remote cat-emacs/tap "$GITHUB_WORKSPACE"
          brew install cat-emacs/tap/android-project cat-emacs/tap/compose-preview
          brew test cat-emacs/tap/android-project
          brew test cat-emacs/tap/compose-preview
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Respect an explicitly selected JDK
        run: |
          for cli in android-project compose-preview; do
            "$cli" doctor --json > "$RUNNER_TEMP/$cli.json"
            python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["javaVersion"]; assert v == "17" or v.startswith("17."), v' "$RUNNER_TEMP/$cli.json"
          done
